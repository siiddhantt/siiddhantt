      .pulse-2 { animation: pulse 2.8s ease-in-out 0.9s infinite; transform-origin: center; }
      .dash { stroke-dasharray: 8 10; animation: drift 8s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes drift { to { stroke-dashoffset: -72; } }
    </style>
